[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatspeechbench"
version = "0.1.0"
description = "Benchmark Indian-language speech recognition under clean, telephone-quality and noisy audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile", "jiwer", "pandas", "pyarrow"]

[project.optional-dependencies]
whisper = ["faster-whisper"]
dev = ["pytest"]
app = ["streamlit>=1.50", "plotly"]

[project.scripts]
bharatspeechbench = "bharatspeechbench.cli:main"
bsb = "bharatspeechbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
